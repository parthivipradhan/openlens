name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-api:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:16-3.4-alpine
        env:
          POSTGRES_USER: localitylens
          POSTGRES_PASSWORD: localitylens_dev
          POSTGRES_DB: localitylens
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U localitylens"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://localitylens:localitylens_dev@localhost:5432/localitylens
      AI_MOCK_MODE: "true"
      AI_PROVIDER: mock
      CHAIN_ENABLED: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r services/api/requirements.txt
        working-directory: .

      - name: Run migrations
        run: alembic upgrade head
        working-directory: services/api

      - name: Run tests
        run: pytest services/api/tests -v
        working-directory: services/api

  lint-api:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check services/api/

  test-frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm test -- --passWithNoTests
        working-directory: apps/web
